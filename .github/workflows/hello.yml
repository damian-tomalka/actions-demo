name: Hello

on:
  push:
  workflow_dispatch:
env:
  KURS: DevOps
jobs:
  powitanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Przywitaj sie
        run: echo "Czesc z GitHub Actions!"

      - name: Celowy blad
        run: cat nie-ma-takiego-pliku.txt

      - name: Informacje o maszynie
        run: |
          date
          uname -a
          whoami
          pwd

      - name: Zmienne i konteksty
        run: |
          echo "Kurs: $KURS"
          echo "Uruchomil: ${{ github.actor }}"
          echo "Galaz: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Zdarzenie: ${{ github.event_name }}"

      - name: Podsumowanie
        run: |
          echo "### Uruchomil ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Uruchom skrypt
        run: bash scripts/powitanie.sh
